name: Tracking preview

on:
  workflow_dispatch:
    inputs:
      approval_id:
        required: true
        type: string
      worker_sha:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.scope.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.worker_sha }}
      - id: scope
        run: |
          test "$WORKER_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$APPROVAL_ID" = "owner-preview-tracking-2026-08-15"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx --test workers/events/tests/collector.test.mts tests/quality/environment-resource-isolation.test.mts tests/quality/deployment-scripts.test.mts tests/quality/tracking-preview-ci.test.mts
      - run: npm run build
    env:
      APPROVAL_ID: ${{ inputs.approval_id }}
      WORKER_SHA: ${{ inputs.worker_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}

  preview:
    needs: verify
    environment: tracking-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-tracking-migrations.mjs --environment preview --approval-id "$APPROVAL_ID" --worker-sha "$WORKER_SHA" --source-sha "$SOURCE_SHA" --execute
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: node scripts/activate-tracking-preview-readiness.mjs --environment preview --approval-id "$APPROVAL_ID" --worker-sha "$WORKER_SHA" --source-sha "$SOURCE_SHA" --execute
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: node scripts/publish-events-worker.mjs --environment preview --approval-id "$APPROVAL_ID" --worker-sha "$WORKER_SHA" --source-sha "$SOURCE_SHA" --execute
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run build
      - run: npx wrangler pages deploy dist/client --project-name owned-funnel-builder --branch tracking-preview --commit-hash "$WORKER_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: node scripts/prove-tracking-preview.mjs --environment preview --approval-id "$APPROVAL_ID" --worker-sha "$WORKER_SHA" --source-sha "$SOURCE_SHA" --execute
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRACKING_PAGES_BRIDGE_KEY_CURRENT: ${{ secrets.TRACKING_PAGES_BRIDGE_KEY_CURRENT }}
          TRACKING_PREVIEW_PROOF_TOKEN: ${{ secrets.TRACKING_PREVIEW_PROOF_TOKEN }}
    env:
      APPROVAL_ID: ${{ inputs.approval_id }}
      WORKER_SHA: ${{ needs.verify.outputs.sha }}
      SOURCE_SHA: ${{ needs.verify.outputs.sha }}
      TRACKING_MIGRATION_SET_SHA: ${{ vars.TRACKING_MIGRATION_SET_SHA }}
